name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # packages is emptied because the action's default list includes the
      # obsolete 'tools' package, which no longer exists in the SDK repository
      # and fails the install. The packages this build needs are installed below.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install the SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      # The Gradle wrapper JAR is not tracked in this repository, so the version
      # from gradle/wrapper/gradle-wrapper.properties is installed explicitly
      # instead of going through ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build the debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: cleanboard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
