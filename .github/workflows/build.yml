name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    # Needed by the release step below to create the release and upload the APK
    # to it. Every other step in this job only reads the repository.
    permissions:
      contents: write

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # packages is emptied because the action's default list includes the
      # obsolete 'tools' package, which no longer exists in the SDK repository
      # and fails the install. The packages this build needs are installed below.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install the SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      # The wrapper JAR is tracked in this repository, so it is checked against
      # Gradle's published checksums before it is executed.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: cleanboard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only tag pushes publish a release; branch pushes and pull requests stop
      # at the artifact above. The APK is renamed to carry the tag so that the
      # downloaded file is identifiable outside of the release page.
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No APK found to attach." >&2
            exit 1
          fi
          asset="cleanboard-${TAG}-debug.apk"
          cp "$apk" "$asset"

          # The release is created on the first run for a tag and reused after,
          # so that a re-run replaces the asset instead of failing outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "CleanBoard $TAG" \
              --notes "Debug APK built from ${GITHUB_SHA}. Signed with the Android debug key, not for distribution."
          fi
